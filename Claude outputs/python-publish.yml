name: pyLoopSage

on:
  release:
    types: [published]

permissions:
  contents: read

# One docs deployment at a time; a newer release replaces a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Build the documentation site (fails on broken pages or an outdated reference)
  docs-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install documentation tools
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs-material numpy

    # The CLI/config tables are generated from the code: they must be committed up to date
    - name: Check that the reference pages are up to date
      run: |
        PYTHONPATH=src python tools/make_reference.py
        git diff --exit-code -- markdown/reference

    - name: Build site
      run: mkdocs build --strict

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  # 2) Publish the documentation to GitHub Pages
  docs-deploy:
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4

  # 3) Publish to PyPI, only after the documentation was published successfully
  deploy:
    needs: docs-deploy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4  # Check out your repository
    
    # Set up Python 3.10 for the environment
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    # Clean any trash that remained
    - name: Clean build artifacts
      run: |
        rm -rf build/ dist/ *.egg-info

    # Install dependencies needed for the build and environment setup
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build  # Needed to build the package
        pip install .  # Install the LoopSage package from the current directory

    # Build the package (wheel + source distribution)
    - name: Build package
      run: python -m build

    # Use PyPI token
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@v1.3.0
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verify_metadata: true
        skip_existing: false
