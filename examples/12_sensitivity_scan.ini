# Sensitivity scan with `loopsage-scan examples/12_sensitivity_scan.ini`.
# Sandbox polymer; temperature (dense, to resolve phase transitions) crossed with the number of LEFs.
[scan]
name       = temperature_transition
design     = grid
replicates = 4

[system]
n_beads = 300
n_ctcf  = 12

[base]
n_steps = 100000

[sweep]
T     = lin(1, 16, 12)
n_lef = 4, 12
