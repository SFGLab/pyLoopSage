; Simulated annealing: the temperature decays from t_init to t_final, so loops settle into a low-energy state.
[input]
interaction_file = loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000
n_beads = 2000                 ; 9 kb per bead (empty = region / 2 kb: large and slow)

[monte_carlo]
method = Annealing             ; Metropolis keeps a constant temperature
t_init = 5.0
t_final = 0.1
n_steps = 200000
mc_step = 1000
burnin = 40000
