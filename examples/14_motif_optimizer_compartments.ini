; Complete workflow: loops without CTCF orientation -> motif search -> optimizer -> compartments -> 3D.
; Run: loopsage -c examples/14_motif_optimizer_compartments.ini
[input]
interaction_file = loops.bedpe          ; loops with 6-7 columns, no orientation needed
chrom = chr1
region_start = 75000000
region_end = 95000000
n_beads = 2000
motif_genome = hg38.fa                  ; FASTA (+ .fai): anchors get orientations from CTCF motifs
motif_pvalue = 1e-5                     ; smaller = stricter
comp_bed_file = compartments.bed        ; or comp_bw_file = compartments.bw

[optimizer]
optimize = True                         ; fit LEFs, folding, binding and temperatures first
opt_evals = 60
opt_interactive = False

[energy]
epi_coeff = 1.0                         ; > 0: compartment (epigenetic) model on

[molecular_dynamics]
run_md = True
do_compartments = True                  ; block-copolymer force from the compartments

[output]
seed = 1
