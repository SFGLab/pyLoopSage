; Loop extrusion coupled to A/B compartments (epigenetic model) and a compartment-coloured 3D structure.
[input]
interaction_file = loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000
comp_bed_file = compartments.bed       ; or comp_bw_file = compartments.bw

[energy]
epi_coeff = 0.5                ; 0 = pure loop extrusion (default)
n_epi_states = 3

[molecular_dynamics]
run_md = True
do_compartments = True
