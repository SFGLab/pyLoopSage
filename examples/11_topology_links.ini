; Optional topology study: loops that link in 3D. Everything in [topology] is advanced and off by default.
; Run: loopsage -c examples/11_topology_links.ini --knots   (--knots turns the linking analysis on; the rest is config-only)
[input]
interaction_file = loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000

[monte_carlo]
n_steps = 60000
mc_step = 300
burnin = 10000

[molecular_dynamics]
run_MD = True
ev_ff_strength = 100           ; check the barrier in the topology report (with the default exponent 6: about 15 kT at 100, about 10 kT at 93)

[topology]
topo_mode = local              ; short strand-passage events at close contacts (default: random)
topo_rate = 5                  ; attempts per MD frame per 1000 beads
topo_radius = 2                ; bond lengths
topo_width = 3                 ; beads of the passing strand
topo_window = 0.05             ; share of the frame with EV off, per attempt
topo_keep = 1.0                ; below 1: a passage that creates a link is undone with probability 1 - topo_keep
track_crossings = True         ; count chain crossings (leaks of the excluded volume)
knots_stride = 10
