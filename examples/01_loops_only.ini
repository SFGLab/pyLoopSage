; Minimal run: loops from a BEDPE file, Monte Carlo only (no 3D). Run: loopsage -c examples/01_loops_only.ini
[input]
interaction_file = loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000
n_beads = 2000                 ; 9 kb per bead (empty = region / 2 kb: large and slow)

[output]
out_path = results
seed = 1
