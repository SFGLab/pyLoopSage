# Topology sensitivity scan: how do local topoisomerase events and excluded volume change links?
# Slow (3D dynamics for every run): keep the sandbox and the number of points small. `loopsage-scan --dry-run` estimates the time.
[scan]
name       = topology
design     = grid
replicates = 3
md         = true
topology   = true
md_frames  = 20

[system]
n_beads = 200
n_ctcf  = 10

[base]
n_steps = 50000

[sweep]
n_lef     = 8, 16
topo_rate = 0.0, 0.01, 0.05
