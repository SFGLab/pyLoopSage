; ChIA-PET / HiChIP loops: filter weak loops and infer CTCF anchor orientation from the genome sequence.
[input]
interaction_file = chiapet_ctcf.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000
min_pet = 3                    ; keep loops with >= 3 PET counts
motif_genome = hg38.fa         ; enables the CTCF motif search (bundled JASPAR MA0139.1)
motif_pvalue = 1e-05

[monte_carlo]
n_steps = 100000
mc_step = 500
burnin = 20000
