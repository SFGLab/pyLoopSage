; Fit the number of LEFs, folding and binding coefficients and the temperatures first (Nelder-Mead on short Monte Carlo runs), then run with the best values. Same as the flag: loopsage -c ... --optimize
[input]
interaction_file = loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000
n_beads = 2000                 ; 9 kb per bead (empty = region / 2 kb: large and slow)

[optimizer]
optimize = True
opt_evals = 60                 ; short MC runs of the search
opt_steps = 4000               ; MC steps of one short run (the final check runs 3x longer)
opt_early_stop = True          ; stop when the loss no longer improves
opt_interactive = True         ; press Enter in a terminal to see the best values and stop

[monte_carlo]
n_steps = 100000
mc_step = 500
burnin = 20000
