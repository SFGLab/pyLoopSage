; Fit K, f and b first (Nelder-Mead on short Monte Carlo runs), then run with the best values. Same as the flag: loopsage -c ... --optimize
[input]
interaction_file = loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000

[optimizer]
optimize = True
opt_evals = 60                 ; short MC runs of the search
opt_steps = 20000              ; MC steps of one short run (the final check runs 3x longer)

[monte_carlo]
n_steps = 100000
mc_step = 500
burnin = 20000
