; Production run on a workstation or cluster: several independent chains on many threads, long sampling.
[input]
interaction_file = loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000

[parallel]
threads = 8
replicas = 4                   ; independent Monte Carlo chains

[monte_carlo]
n_steps = 1000000
mc_step = 2000
burnin = 200000

[molecular_dynamics]
run_md = True
platform = CUDA

[analysis]
detect_knots = True
