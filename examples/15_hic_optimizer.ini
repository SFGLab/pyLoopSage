; Optimize against a Hi-C map instead of the loops, then validate the model on the same map.
; Run: loopsage -c examples/15_hic_optimizer.ini
[input]
interaction_file = loops.bedpe
hic_file = sample.hic                   ; read with hic-straw
hic_resolution = 0                      ; 0 = closest to the bead size
chrom = chr1
region_start = 75000000
region_end = 95000000
n_beads = 2000

[analysis]
track_smooth = 7.0                    ; smoothing of insulation / A-B tracks (beads)

[optimizer]
optimize = True
hic_denoise = 1.0                       ; brings out the TAD pattern of the target (validation uses the raw map)

[molecular_dynamics]
run_md = True
