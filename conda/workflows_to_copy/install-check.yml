name: install check

# Does a clean install work with pip, uv and conda? Runs on every push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-uv:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: pip
        run: |
          python -m venv .pipenv && .pipenv/bin/pip install .
          .pipenv/bin/loopsage -h
          .pipenv/bin/python -c "import openmm; assert tuple(map(int, openmm.__version__.split('.')[:2])) >= (8, 5), openmm.__version__"
      - name: uv
        run: |
          uv venv .uvenv --python ${{ matrix.python }}
          uv pip install --python .uvenv/bin/python .
          .uvenv/bin/loopsage -h

  conda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: loopsage
      - run: loopsage -h
