name: pyLoopSage release

# Publish a GitHub release (tag v<version>) and this builds PyPI and conda packages.
# uv installs from PyPI, so it needs nothing extra.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:                                  # the tag must match src/loopsage/version.py
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(python3 -c "import re,pathlib;print(re.search(r'\"([^\"]+)\"', pathlib.Path('src/loopsage/version.py').read_text()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1
          fi

  pypi:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: false

  conda:                                  # needs the secret ANACONDA_API_TOKEN; without it the package is only built
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
      - run: conda install -y conda-build anaconda-client
      - name: Build
        run: conda build conda --output-folder out -c conda-forge --override-channels
      - name: Upload to anaconda.org/SFGLab
        env:
          TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No ANACONDA_API_TOKEN: package built, not uploaded"; exit 0; fi
          anaconda -t "$TOKEN" upload --user SFGLab --skip-existing out/noarch/*
