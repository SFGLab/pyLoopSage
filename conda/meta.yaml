{% set version = load_file_regex(load_file="../src/loopsage/version.py", regex_pattern='__version__ = "(.+)"', from_recipe_dir=True)[1] %}   {# single source: version.py #}

package:
  name: pyloopsage
  version: {{ version }}

source:
  path: ..                          # build from this checkout, so the conda version always matches the PyPI one

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - loopsage = loopsage.api:cli
    - loopsage-scan = loopsage.sensitivity.cli:cli

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.0
    - numba >=0.59
    - matplotlib-base >=3.8
    - rich >=13.7
    - openmm >=8.5.1
    - pyvista >=0.43
    - imageio >=2.34
    - imageio-ffmpeg >=0.5
    - pillow >=10

test:
  imports:
    - loopsage
  commands:
    - loopsage -h
    - loopsage-scan -h

about:
  home: https://github.com/SFGLab/pyLoopSage
  summary: An energy-based stochastic model of loop extrusion in chromatin.
  license: GPL-3.0-only
  doc_url: https://sfglab.github.io/pyLoopSage/
  dev_url: https://github.com/SFGLab/pyLoopSage
