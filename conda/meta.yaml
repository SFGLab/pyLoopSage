{% set name = "pyloopsage" %}
{% set version = "2.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: REPLACE_WITH_SDIST_SHA256   # after the PyPI upload: sha256sum of the .tar.gz (or `grayskull pypi pyloopsage`)

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - loopsage = loopsage.api:cli
    - loopsage-scan = loopsage.sensitivity.cli:cli

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.0
    - numba >=0.59
    - matplotlib-base >=3.8
    - rich >=13.7
    - openmm >=8.5.1
    - pyvista >=0.43
    - imageio >=2.34
    - imageio-ffmpeg >=0.5
    - pillow >=10

test:
  imports:
    - loopsage
  commands:
    - loopsage -h
    - loopsage-scan -h

about:
  home: https://github.com/SFGLab/pyLoopSage
  summary: An energy-based stochastic model of loop extrusion in chromatin.
  description: Loop-extruding factors, CTCF motif search, parameter optimizer and 3D molecular dynamics (OpenMM) from one command.
  license: GPL-3.0-only
  license_file: LICENSE            # add a LICENSE file (GPL-3.0 text) to the repository before submitting
  doc_url: https://sfglab.github.io/pyLoopSage/
  dev_url: https://github.com/SFGLab/pyLoopSage

extra:
  recipe-maintainers:
    - GITHUB_USERNAME              # replace with the GitHub login(s) of the maintainers
