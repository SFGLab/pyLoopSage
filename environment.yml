# conda env create -f environment.yml && conda activate loopsage
name: loopsage
channels:
  - conda-forge
  - bioconda            # pybigwig lives here
channel_priority: strict
dependencies:
  - python=3.11
  - numpy>=2.0          # numpy 2.x required (numpy 1.x is not supported)
  - scipy>=1.11
  - pandas>=2.0
  - numba>=0.60
  - matplotlib-base>=3.8
  - rich>=13.7
  - openmm>=8.5.1
  - pyvista>=0.43
  - imageio>=2.34
  - imageio-ffmpeg>=0.5
  - pillow>=10
  - pybigwig>=0.3.22
  # NVIDIA GPU: add one of these lines so conda picks the CUDA build of openmm
  # - cuda-version=12
  # - cuda-version=13
  - pip
  - pip:
      - -e .            # pyLoopSage itself (its dependencies are already installed above)
      # - hic-straw>=1.3  # .hic reference maps, needs a C++ compiler
      # - topoly>=1.0     # linking numbers
