# LoopSage: resolved configuration (defaults + config file + command line)

[input]  ; Input data and genomic region
; Loops/peaks file: .bedpe, .bed or .narrowPeak (required) 
interaction_file = 
; Optional Hi-C map (.hic, read with hic-straw): reference for the validation and, with --optimize, the target of the optimizer 
hic_file = 
; Hi-C normalisation to read (falls back to SCALE, VC_SQRT, VC, NONE when missing) 
hic_norm = KR
; Hi-C bin size to read (0 = automatic, closest to the bead size) [bp] 
hic_resolution = 0
; Chromosome, e.g. chr1 (CLI: use --region) 
chrom = chr1
; Region start (empty = chromosome start) [bp] 
region_start = 77000000
; Region end (empty = chromosome end) [bp] 
region_end = 95000000
; Genome assembly for chromosome sizes 
genome = hg38
; Number of simulation beads (empty = region / 2 kb) [beads] 
n_beads = 
; Smooth the anchor/peak signal with a Gaussian 
smoothing_input = False
; BigWig tracks for extra binding energy (comma-separated) 
bw_files = 
; Strength r per BigWig track (empty = -N_beads/10 each) 
bw_strengths = 
; BigWig of LEF loading preference (cohesin/condensin ChIP) 
lef_track_file = 
; BigWig of compartments (A/B signal) 
comp_bw_file = 
; BED of compartments / subcompartments 
comp_bed_file = 
; BEDPE: keep only loops with at least this many PET counts / score (0 = keep all) [PET] 
min_pet = 0
; BEDPE: reference genome FASTA; enables the CTCF motif search that sets anchor orientations 
motif_genome = 
; Motif PFM file (empty = bundled JASPAR CTCF MA0139.1) 
motif_pfm = 
; Motif hit cutoff: chance of a hit in random sequence (smaller = stricter) [p-value] 
motif_pvalue = 1e-05
; Pseudocount added to the PFM counts (avoids impossible bases) 
motif_pseudocount = 0.8
; Extend every anchor by this many bp on both sides before the motif search [bp] 
motif_pad = 0

[output]  ; Output and reproducibility
; Results folder (empty = <project>/results); each run gets its own subfolder 
out_path = 
; Run number in the folder name (empty = next free; standalone stages reuse the latest) 
run_number = 
; Console detail: 0 main steps + progress bars, 1 + tables, 2 + info messages, 3 + debug (CLI: -v, -vv, -vvv) 
verbosity = 0
; Print nothing to the console (the log file and the report are still written) 
quiet = False
; Random seed (empty = random) 
seed = 
; Write report.html 
report = True
; Save map matrices (MC and MD heatmaps, distances, strengths) as .npy in data/metadata 
save_metadata = True
; Save every MD frame as .cif 
save_ensemble = True

[parallel]  ; Parallelism and replicas
; Worker threads for the numba sampler, OpenMM CPU and numba kernels (0 = all cores) [threads] 
threads = 1
; Independent Monte Carlo chains (seed, seed+1, ...) run in parallel; the ensemble is pooled [chains] 
replicas = 1

[monte_carlo]  ; Monte Carlo (loop extrusion) sampler
; Total Monte Carlo steps [MC steps] 
n_steps = 40000
; Save one snapshot every this many steps [MC steps] 
mc_step = 200
; Burn-in period discarded from statistics [MC steps] 
burnin = 1000
; Initial temperature [a.u.] 
t_init = 2.0
; Final temperature (Annealing only) [a.u.] 
t_final = 1.0
; Sampling method 
method = Annealing
; Loop extrusion factors (empty = N_anchors / 2) [LEFs] 
n_lef = 
; Second LEF family (different speed) [LEFs] 
n_lef2 = 0
; Kept for compatibility with the original LoopSage (has no effect there either) 
lef_drift = False
; LEF legs slide as a random walk (True, original) or only extrude outward (False) 
lef_rw = True
; Initial LEF speeds: constant (all equal, original), maxwell (Maxwell-Boltzmann), lognormal, or two_state (slow and fast LEFs); mean speed is always 1 
lef_speed_dist = constant
; lognormal only: width (sigma of ln speed) 
lef_speed_spread = 0.5
; two_state only: fraction of fast LEFs 
lef_fast_fraction = 0.2
; two_state only: speed of fast LEFs relative to slow ones 
lef_fast_ratio = 5.0
; Sliding step uniform in [1, shortest loop] beads 
variable_sliding_step = False
; Epigenetic model only: probability that a step changes a bead's epigenetic state instead of moving a LEF 
p_epigenetic = 0.5

[energy]  ; Energy model coefficients
; Folding coefficient f 
folding_coeff = 1.0
; Folding coefficient f2 of the second family 
folding_coeff2 = 0.0
; Anchor binding coefficient b 
bind_coeff = 1.0
; LEF crossing coefficient kappa 
cross_coeff = 1.0
; Epigenetic-model coupling strength; 0 = off (default: pure loop-extrusion model) 
epi_coeff = 0.0
; Number of epigenetic states 
n_epi_states = 3
; Epigenetic coupling J_ij: 'dynamic' = 1 on the backbone and on current LEF loops, else 0 (follows the LEFs); 'static' = fixed map from the loop data (advanced, config.ini only) 
epigenetic_mode = dynamic
; Penalise crossing loops, not only shared anchors 
cross_loop = True
; Apply crossing penalty between LEF families 
between_families_penalty = True
; 0 = 1D anchor profiles L/R; 1 = 2D loop map 
data_loss_mode = 0
; Gaussian width of the 2D loop map J_loss when data_loss_mode = 1, so LEF legs feel a smooth landscape (advanced, config.ini only) [beads] 
loss_sigma = 2.0
; Penalise loop-free regions (tanh-contrast signals) 
contrastive_binding = False

[molecular_dynamics]  ; Molecular dynamics (3D structures)
; Device index for CUDA or OpenCL (count from 0; empty = default) 
device = 
; Run the 3D molecular dynamics stage 
run_md = True
; OpenMM platform: auto (try CUDA, then OpenCL, then parallel CPU), CUDA, OpenCL, CPU or Reference 
platform = auto
; Initial polymer shape 
initial_structure_type = rw
; Integrator time step [fs] 
integrator_step = 100.0
; MD steps per MC snapshot (per frame) [MD steps] 
sim_step = 2000
; Simulation temperature [K] 
sim_temp = 310.0
; Langevin friction [1/ps] 
friction = 0.1
; Energy-minimisation tolerance [kJ/mol/nm] 
tolerance = 0.001
; Chain stiffness (angle force) [kJ/mol/rad^2] 
angle_ff_strength = 100.0
; Loop-anchor equilibrium distance [nm] 
le_ff_length = 0.1
; Loop-anchor spring constant [kJ/mol/nm^2] 
le_ff_strength = 60000.0
; Excluded-volume strength [kJ/mol] 
ev_ff_strength = 100.0
; Excluded-volume exponent 
ev_ff_power = 3.0
; Topoisomerase: probability/fraction with excluded volume off 
ev_p = 0.0
; Topoisomerase acts on one continuous stretch 
continuous_top = False
; Add block-copolymer compartment force (needs epi_coeff > 0) 
do_compartments = False
; Simulate only post-burn-in MC snapshots (original LoopSage uses every snapshot) 
md_skip_burnin = False
; OpenMM force-field XML 
forcefield_path = /mnt/attach/outputs/pyLoopSage/src/molecular_dynamics/forcefields/classic_sm_ff.xml

[structure_3d]  ; 3D structure analysis and rendering
; Write 3d_viewer.html and videos of the 3D trajectory 
render_3d = True
; Render mp4 videos (needs pyvista; ffmpeg via imageio-ffmpeg) 
make_videos = True
; Video colourings: purple, rainbow, compartments (added automatically when compartments are loaded) 
colorings = purple, rainbow
; Video representation: tube (continuous chain) or beads (beads on a string); the viewer offers both 
representation = tube
; Interpolated frames between two MD frames (smooth trajectories) [frames] 
interp_steps = 5
; Video frame rate [fps] 
video_fps = 30
; Video width and height [px] 
video_size = 640
; Maximum frames per video [frames] 
max_video_frames = 240

[analysis]  ; Analysis
; Gaussian smoothing (beads) applied to per-position signals before the extra validation correlations (0 = off) [beads] 
corr_smooth = 1.5
; Contact distance for MD contact maps [nm] 
contact_radius = 1.0
; Optional linking analysis of loops in 3D (slow; off by default) 
detect_knots = False
; Snapshots shown in the zoomed kymograph (window near equilibrium) [snapshots] 
zoom_snapshots = 120
; First snapshot of the zoom window (empty = middle of production) [snapshot] 
zoom_start = 
; Use every n-th MD frame for linking numbers [frames] 
knots_stride = 10

[optimizer]  ; Parameter optimizer (--optimize)
; Before the run, fit the number of LEFs, folding and binding coefficients with Nelder-Mead on short Monte Carlo runs (n_lef of the first family, f, b and the temperature schedule), then run with them 
optimize = False
; Maximum number of short Monte Carlo evaluations of the optimizer [evaluations] 
opt_evals = 60
; Monte Carlo steps of one evaluation (the final candidate check runs 3x longer) [MC steps] 
opt_steps = 20000
; Smoothing of the optimizer target built from the input loops, so that the sparse loops look like a Hi-C map (0 = none) [beads] 
target_smooth = 0.8
; Denoising of the Hi-C target of the optimizer, to bring out the TAD pattern (0 = none); validation always uses the raw map [beads] 
hic_denoise = 1.0
