# LoopSage: resolved configuration (defaults + config file + command line)

[input]  ; Input data and genomic region
; Loops/peaks file: .bedpe, .bed or .narrowPeak (required)  (from default)
interaction_file = 
; Optional Hi-C map (.hic, read with hic-straw): reference for the validation and, with --optimize, the target of the optimizer  (from default)
hic_file = 
; Hi-C normalisation to read (falls back to SCALE, VC_SQRT, VC, NONE when missing)  (from default)
hic_norm = KR
; Hi-C bin size to read (0 = automatic, closest to the bead size) [bp]  (from default)
hic_resolution = 0
; Chromosome, e.g. chr1 (CLI: use --region)  (from default)
chrom = chr1
; Region start (empty = chromosome start) [bp]  (from default)
region_start = 77000000
; Region end (empty = chromosome end) [bp]  (from default)
region_end = 95000000
; Genome assembly for chromosome sizes  (from default)
genome = hg38
; Number of simulation beads (empty = region / 2 kb) [beads]  (from default)
n_beads = 
; Smooth the anchor/peak signal with a Gaussian  (from default)
smoothing_input = True
; BigWig tracks for extra binding energy (comma-separated)  (from default)
bw_files = 
; Strength r per BigWig track (empty = -N_beads/10 each)  (from default)
bw_strengths = 
; BigWig of LEF loading preference (cohesin/condensin ChIP)  (from default)
lef_track_file = 
; BigWig of compartments (A/B signal)  (from default)
comp_bw_file = 
; BED of compartments / subcompartments  (from default)
comp_bed_file = 
; BEDPE: keep only loops with at least this many PET counts / score (0 = keep all) [PET]  (from default)
min_pet = 0
; BEDPE: reference genome FASTA; enables the CTCF motif search that sets anchor orientations  (from default)
motif_genome = 
; Motif PFM file (empty = bundled JASPAR CTCF MA0139.1)  (from default)
motif_pfm = 
; Motif hit cutoff: chance of a hit in random sequence (smaller = stricter) [p-value]  (from default)
motif_pvalue = 1e-05
; Pseudocount added to the PFM counts (avoids impossible bases)  (from default)
motif_pseudocount = 0.8
; Extend every anchor by this many bp on both sides before the motif search [bp]  (from default)
motif_pad = 0

[output]  ; Output and reproducibility
; Results folder (empty = <project>/results); each run gets its own subfolder  (from default)
out_path = 
; Run number in the folder name (empty = next free; standalone stages reuse the latest)  (from default)
run_number = 
; Console detail: 0 main steps + progress bars, 1 + tables, 2 + info messages, 3 + debug (CLI: -v, -vv, -vvv)  (from default)
verbosity = 0
; Print nothing to the console (the log file and the report are still written)  (from default)
quiet = False
; Random seed (empty = a random one, saved in the resolved config); the same seed repeats the run exactly, MD included only with --threads 1  (from default)
seed = 
; Write report.html  (from default)
report = True
; Save map matrices (MC and MD heatmaps, distances, strengths) as .npy in data/metadata  (from default)
save_metadata = True
; Save every MD frame as .cif  (from default)
save_ensemble = True

[parallel]  ; Parallelism and replicas
; Worker threads for the numba sampler, OpenMM CPU and numba kernels (0 = all cores) [threads]  (from default)
threads = 1
; Independent Monte Carlo chains (seed, seed+1, ...) run in parallel; the ensemble is pooled [chains]  (from default)
replicas = 1

[monte_carlo]  ; Monte Carlo (loop extrusion) sampler
; Total Monte Carlo steps [MC steps]  (from default)
n_steps = 40000
; Save one snapshot every this many steps [MC steps]  (from default)
mc_step = 200
; Burn-in period discarded from statistics [MC steps]  (from default)
burnin = 1000
; Initial temperature [a.u.]  (from default)
t_init = 3.0
; Final temperature (Annealing only) [a.u.]  (from default)
t_final = 1.0
; Sampling method  (from default)
method = Annealing
; Loop extrusion factors (empty = N_anchors / 2) [LEFs]  (from default)
n_lef = 
; Second LEF family (different speed) [LEFs]  (from default)
n_lef2 = 0
; Kept for compatibility with the original LoopSage (has no effect there either)  (from default)
lef_drift = False
; LEF legs slide as a random walk (True, original) or only extrude outward (False)  (from default)
lef_rw = True
; Initial LEF speeds: constant (all equal, original), maxwell (Maxwell-Boltzmann), lognormal, or two_state (slow and fast LEFs); mean speed is always 1  (from default)
lef_speed_dist = constant
; lognormal only: width (sigma of ln speed)  (from default)
lef_speed_spread = 0.5
; two_state only: fraction of fast LEFs  (from default)
lef_fast_fraction = 0.2
; two_state only: speed of fast LEFs relative to slow ones  (from default)
lef_fast_ratio = 5.0
; Sliding step uniform in [1, shortest loop] beads  (from default)
variable_sliding_step = False
; Epigenetic model only: probability that a step changes a bead's epigenetic state instead of moving a LEF  (from default)
p_epigenetic = 0.5

[energy]  ; Energy model coefficients
; Folding coefficient f  (from default)
folding_coeff = 1.0
; Folding coefficient f2 of the second family  (from default)
folding_coeff2 = 0.0
; Anchor binding coefficient b  (from default)
bind_coeff = 1.0
; LEF crossing coefficient kappa  (from default)
cross_coeff = 1.0
; Epigenetic-model coupling strength; 0 = off (default: pure loop-extrusion model)  (from default)
epi_coeff = 0.0
; Number of epigenetic states  (from default)
n_epi_states = 3
; Epigenetic coupling J_ij: 'dynamic' = 1 on the backbone and on current LEF loops, else 0 (follows the LEFs); 'static' = fixed map from the loop data (advanced, config.ini only)  (from default)
epigenetic_mode = dynamic
; Penalise crossing loops, not only shared anchors  (from default)
cross_loop = True
; Apply crossing penalty between LEF families  (from default)
between_families_penalty = True
; 0 = 1D anchor profiles L/R; 1 = 2D loop map  (from default)
data_loss_mode = 0
; Gaussian width of the 2D loop map J_loss when data_loss_mode = 1, so LEF legs feel a smooth landscape (advanced, config.ini only) [beads]  (from default)
loss_sigma = 2.0
; Anchor binding mode: preferential = LEFs are attracted to the anchor profiles (non-negative), loop-free regions cost nothing; contrastive = in addition, loops are penalised for spanning loop-free regions and rewarded for spanning regions the input loops cover (needs loops)
binding_mode = preferential

[molecular_dynamics]  ; Molecular dynamics (3D structures)
; Device index for CUDA or OpenCL (count from 0; empty = default)  (from default)
device = 
; Run the 3D molecular dynamics stage  (from default)
run_md = True
; OpenMM platform: auto (try CUDA, then OpenCL, then parallel CPU), CUDA, OpenCL, CPU or Reference  (from default)
platform = auto
; Initial polymer shape  (from default)
initial_structure_type = rw
; Integrator time step [fs]  (from default)
integrator_step = 100.0
; MD steps per MC snapshot (per frame) [MD steps]  (from default)
sim_step = 5000
; Simulation temperature [K]  (from default)
sim_temp = 310.0
; Langevin friction [1/ps]  (from default)
friction = 0.1
; Energy-minimisation tolerance [kJ/mol/nm]  (from default)
tolerance = 0.001
; Chain stiffness (angle force) [kJ/mol/rad^2]  (from default)
angle_ff_strength = 50.0
; Loop-anchor equilibrium distance [nm]  (from default)
le_ff_length = 0.1
; Loop-anchor spring constant [kJ/mol/nm^2]  (from default)
le_ff_strength = 60000.0
; Excluded-volume strength [kJ/mol]  (from default)
ev_ff_strength = 100.0
; Excluded-volume exponent  (from default)
ev_ff_power = 3.0
; Add block-copolymer compartment force (needs epi_coeff > 0)  (from default)
do_compartments = False
; Block-copolymer compartment attraction: scale of the interaction table (1 = the original strength; lower = softer, compartments stay open instead of collapsing)  (from default)
comp_strength = 0.25
; Block-copolymer attraction range in units of sqrt(N) nm (the original value was 0.05; smaller = shorter range)  (from default)
comp_range = 0.03
; Simulate only post-burn-in MC snapshots (original LoopSage uses every snapshot)  (from default)
md_skip_burnin = False
; OpenMM force-field XML  (from default)
forcefield_path = src/molecular_dynamics/forcefields/classic_sm_ff.xml

[structure_3d]  ; 3D structure analysis and rendering
; Write 3d_viewer.html and videos of the 3D trajectory  (from default)
render_3d = True
; Render mp4 videos (needs pyvista; ffmpeg via imageio-ffmpeg)  (from default)
make_videos = True
; Video colourings: purple, rainbow, compartments (added automatically when compartments are loaded)  (from default)
colorings = purple, rainbow
; Video representation: tube (continuous chain) or beads (beads on a string); the viewer offers both  (from default)
representation = tube
; Interpolated frames between two MD frames (smooth trajectories) [frames]  (from default)
interp_steps = 5
; Video frame rate [fps]  (from default)
video_fps = 30
; Video width and height [px]  (from default)
video_size = 640
; Maximum frames per video [frames]  (from default)
max_video_frames = 240

[analysis]  ; Analysis
; Gaussian smoothing (beads) applied to per-position signals before the extra validation correlations (0 = off) [beads]  (from default)
corr_smooth = 1.5
; Contact distance for MD contact maps [nm]  (from default)
contact_radius = 1.0
; Snapshots shown in the zoomed kymograph (window near equilibrium) [snapshots]  (from default)
zoom_snapshots = 120
; First snapshot of the zoom window (empty = middle of production) [snapshot]  (from default)
zoom_start = 

[optimizer]  ; Parameter optimizer (--optimize)
; Before the run, fit the number of LEFs, folding and binding coefficients with Nelder-Mead on short Monte Carlo runs (n_lef of the first family, f, b and the temperature schedule), then run with them  (from default)
optimize = False
; Maximum number of short Monte Carlo evaluations of the optimizer [evaluations]  (from default)
opt_evals = 60
; Stop the optimizer early when the loss no longer improves  (from default)
opt_early_stop = True
; Early stopping: evaluations without a real improvement (see opt_min_gain) before the optimizer stops [evaluations]  (from default)
opt_patience = 20
; Early stopping: smallest drop of the best loss that counts as an improvement (the loss is about 1-4 at the start)  (from default)
opt_min_gain = 0.01
; Monte Carlo steps of one evaluation (the final candidate check runs 3x longer) [MC steps]  (from default)
opt_steps = 20000
; Smoothing of the optimizer target built from the input loops, so that the sparse loops look like a Hi-C map (0 = none) [beads]  (from default)
target_smooth = 0.8
; Denoising of the Hi-C target of the optimizer, to bring out the TAD pattern (0 = none); validation always uses the raw map [beads]  (from default)
hic_denoise = 1.0

[topology]  ; Topology: topoisomerase, chain crossings and linking (optional, advanced)
; Optional linking analysis of loops in 3D (slow; off by default)  (from default)
detect_knots = False
; Use every n-th MD frame for linking numbers [frames]  (from default)
knots_stride = 10
; Topoisomerase ('random' mode): probability/fraction of beads with excluded volume off during a frame  (from default)
ev_p = 0.0
; Topoisomerase ('random' mode) acts on one continuous stretch  (from default)
continuous_top = False
; Topoisomerase model: 'random' (beads with EV off for a whole frame, set by ev_p) or 'local' (short strand-passage events at close contacts)  (from default)
topo_mode = random
; 'local' mode: strand-passage attempts per MD frame per 1000 beads [events]  (from default)
topo_rate = 5.0
; 'local' mode: strands closer than this can pass through each other [bond lengths]  (from default)
topo_radius = 2.0
; 'local' mode: beads of the passing strand that lose their excluded volume [beads]  (from default)
topo_width = 3
; 'local' mode: share of the frame's MD steps with excluded volume off, per attempt [fraction]  (from default)
topo_window = 0.05
; 'local' mode: probability to keep a passage that creates a new link between loops (1 = no bias; below 1 the topoisomerase simplifies the topology)  (from default)
topo_keep = 1.0
; Count chain crossings during the MD (checks whether the excluded volume leaks); also on with --knots  (from default)
track_crossings = False
; MD steps between crossing checks [MD steps]  (from default)
track_every = 100
; Strand-crossing barrier used for the suggested ev_ff_strength in the topology report [kT]  (from default)
ev_barrier_target = 10.0
