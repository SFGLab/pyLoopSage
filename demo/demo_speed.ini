; Demo 4 - LEF velocities: Maxwell-Boltzmann distributed sliding rates; the report shows velocity statistics, phase space and flow.
; Few LEFs and weak anchor binding keep loops long enough to move (a dense system with strong anchors is jammed).
[input]
interaction_file = demo/data/demo_loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000
n_beads = 120

[output]
seed = 1

[energy]
bind_coeff = 0.1                ; weak anchors: loops are long and free to move

[monte_carlo]
n_steps = 60000
mc_step = 10
burnin = 6000
method = Metropolis
t_init = 1.0
n_lef = 12
lef_speed_dist = maxwell
lef_rw = True

[molecular_dynamics]
run_md = False
