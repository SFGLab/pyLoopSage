# Demo 5 - sensitivity scan on a synthetic polymer (no input files needed).
# Run it with:  python demo/run_demo.py sensitivity     or     loopsage-scan demo/demo_sensitivity.ini
# About 20 seconds on 4 cores. The report is written to results/scan_demo/sensitivity_report.html (not tracked by git).
#
# What to look for: temperature T is scanned densely, so the report can find where the loops
# freeze (low T), extrude (middle) and dissolve (high T), and show how n_lef moves these transitions.

[scan]
name       = demo
design     = grid          # every combination of the sweep values
replicates = 3             # independent seeds per point
snapshots  = 200           # saved configurations per run
metrics    = default       # mean loop length, parents/children, bound fraction, energy, ...

[system]                   # the synthetic polymer
n_beads     = 300
bp_per_bead = 10000
n_ctcf      = 12
orientation = convergent

[base]                     # fixed loopsage parameters (any key of config.ini)
n_steps = 60000

[sweep]
T     = lin(1, 16, 12)     # 12 temperatures: dense enough to resolve phase transitions
n_lef = 4, 12              # few and many loop extruders
