; Demo 2 - loops + tiny 3D MD + validation + 3D viewer/videos + linking analysis.
[input]
interaction_file = demo/data/demo_loops.bedpe
chrom = chr1
region_start = 77000000
region_end = 95000000
n_beads = 100
comp_bed_file = demo/data/demo_compartments.bed
bw_files = demo/data/demo_ctcf.bw
bw_strengths = 0
lef_track_file = demo/data/demo_lef.bw

[output]
seed = 1

[monte_carlo]
n_steps = 6000
mc_step = 150
burnin = 1200

[molecular_dynamics]
run_md = True
sim_step = 100
ev_p = 0.05

[analysis]
detect_knots = True
knots_stride = 5

[structure_3d]
video_size = 416
max_video_frames = 60
interp_steps = 3
