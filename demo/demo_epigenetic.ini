; Demo 3 - loop extrusion plus the (optional) epigenetic model with dynamic coupling, MC only.
; The coupling J is 1 on the backbone and on the current LEF loops, 0 elsewhere.
[input]
interaction_file = demo/data/demo_loops.bedpe
comp_bed_file = demo/data/demo_compartments.bed
chrom = chr1
region_start = 77000000
region_end = 95000000
n_beads = 120

[output]
seed = 1

[monte_carlo]
n_steps = 8000
mc_step = 100
burnin = 2000

[energy]
epi_coeff = 1.0
n_epi_states = 3
epigenetic_mode = dynamic

[molecular_dynamics]
run_md = False
